name: Website Change Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      TARGET_URL: ${{ secrets.TARGET_URL }}
      SCAN_INTERVAL_MINUTES: "5"
      REQUEST_TIMEOUT_SECONDS: "30"
      ASSET_TIMEOUT_SECONDS: "20"
      MAX_ASSETS_PER_TYPE: "20"
      REQUEST_USER_AGENT: WebsiteChangeDetector-GitHubActions/1.0
      TIMEZONE: Europe/Paris
      ENABLE_SCHEDULER: "false"
      FETCH_LINKED_ASSETS: "true"
      IGNORE_SYSTEM_PROXIES: "true"
      RECORD_SCANS_WITHOUT_CHANGES: "false"
      EMAIL_ENABLED: "true"
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p database
          mkdir -p logs

      - name: Run website scan
        run: python monitor.py --once

      - name: Commit monitoring state
        run: |
          if git diff --quiet -- database/website_monitor.db; then
            echo "No persisted monitoring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/website_monitor.db
          git commit -m "chore: update monitoring state"
          git push
